name: Architecture documentation
on:
  pull_request:
    paths: ['README.md', 'docs/**', 'tests/check-architecture.ps1', '.github/workflows/architecture.yml']
  push:
    branches: [main]
    paths: ['README.md', 'docs/**', 'tests/check-architecture.ps1', '.github/workflows/architecture.yml']
  workflow_dispatch:
    inputs:
      render:
        description: Run the existing optional Mermaid rendering toolchain
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check source, links, syntax and versioned help
        shell: pwsh
        run: ./tests/check-architecture.ps1
  optional-render:
    if: github.event_name == 'workflow_dispatch' && inputs.render
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Optional repeatable Mermaid rendering
        run: python docs/architecture/verify.py --render --chrome "C:/Program Files/Google/Chrome/Application/chrome.exe"
